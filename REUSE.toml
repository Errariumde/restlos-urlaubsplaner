version = 1

# Files that cannot carry comments (JSON) or are generated.
[[annotations]]
path = ["package-lock.json", "flake.lock"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The restlos-urlaubsplaner authors"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = [".mcp.json", ".claude/settings.json", "tools/claude-plugins/**/*.json", "package.json", "tsconfig*.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The restlos-urlaubsplaner authors"
SPDX-License-Identifier = "EUPL-1.2"

# Holiday and calendar data (code/data license).
[[annotations]]
path = ["src/data/**", "src/ui/i18n/*.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The restlos-urlaubsplaner authors"
SPDX-License-Identifier = "EUPL-1.2"

# Typst templates and example files: free to copy into own work.
[[annotations]]
path = ["templates/**", "examples/**", "**/*.urlaub.json", "**/*.regeln.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The restlos-urlaubsplaner authors"
SPDX-License-Identifier = "MIT-0"

# Generated reference data for tests.
[[annotations]]
path = ["tests/reference/python-holidays-de.json", "tests/perf/baseline.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The restlos-urlaubsplaner authors"
SPDX-License-Identifier = "EUPL-1.2"

# Lucide icons, copied from lucide-static 1.60.0 (npm pack). Their LICENSE: ISC for Lucide, MIT for the
# icons derived from Feather (docs/SPEC.md, "Licensing").
[[annotations]]
path = ["src/ui/icons/*.svg"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Lucide Icons and Contributors"
SPDX-License-Identifier = "ISC"

# The Feather-derived ones among them. lucide-static 1.60.0 carries no per-icon origin or alias data
# (tags.json and font/info.json only), and the list in its LICENSE uses old Lucide names. So the reference
# is Feather 4.29's icon set, with Lucide's renames: check, moon, sun, x, columns (now columns-3),
# grid (now layout-grid), more-horizontal (now ellipsis) and alert-triangle (now triangle-alert). Feather
# has no undo-2, redo-2, languages, sun-moon or square-dashed-mouse-pointer: those are Lucide's own (ISC).
[[annotations]]
path = ["src/ui/icons/check.svg", "src/ui/icons/columns-3.svg", "src/ui/icons/ellipsis.svg", "src/ui/icons/layout-grid.svg", "src/ui/icons/moon.svg", "src/ui/icons/sun.svg", "src/ui/icons/triangle-alert.svg", "src/ui/icons/x.svg"]
precedence = "override"
SPDX-FileCopyrightText = ["2013-present Cole Bemis", "2026 Lucide Icons and Contributors"]
SPDX-License-Identifier = "ISC AND MIT"

# Gallery-only message catalogs (dev only, not in the build).
[[annotations]]
path = ["src/gallery/i18n/*.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The restlos-urlaubsplaner authors"
SPDX-License-Identifier = "EUPL-1.2"

# Screenshot baselines of the end-to-end tests.
[[annotations]]
path = ["e2e/__screenshots__/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The restlos-urlaubsplaner authors"
SPDX-License-Identifier = "EUPL-1.2"
