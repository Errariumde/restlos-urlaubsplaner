# flake.lock: Dependabot updates nixpkgs within its release branch (nix
# ecosystem). Moving to the next release is a manual change in flake.nix
# (npm run nixos-release; .claude/skills/dependency-update/SKILL.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    ignore:
      # Pinned to the playwright-driver version of the Nix dev shell;
      # updated together with flake.lock.
      - dependency-name: "@playwright/test"
    groups:
      npm-all:
        patterns: ["*"]
  - package-ecosystem: github-actions
    # "/" covers .github/workflows only; the composite action is listed too.
    directories: ["/", "/.github/actions/nix"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
